# ===========================================
#             Docker Compose File
# ===========================================

services:

  # ===========================================
  #               Nginx Service               
  # ===========================================

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: always
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    ports:
      - "${NGINX_PORT}:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

    depends_on:
      wordpress:
        condition: service_healthy
      hugo:
        condition: service_healthy
      adminer:
        condition: service_healthy
      portainer:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -k -I https://localhost | grep -i nginx || exit 1"]
      interval: 20s
      timeout: 60s
      retries: 5
      start_period: 10s

  # ===========================================
  #               MariaDB Service             
  # ===========================================

  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always

    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER_NAME}
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password

    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    secrets:
      - db_root_password
      - db_password

    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$(cat /run/secrets/db_root_password) || exit 1"]
      interval: 20s
      timeout: 60s
      retries: 5
      start_period: 10s

  # ===========================================
  #               WordPress Service
  # ===========================================

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: always

    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - WORDPRESS_DB_HOST=${WORDPRESS_DB_HOST}
      - WORDPRESS_DB_NAME=${DB_NAME}
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER}
      - WORDPRESS_TITLE=${WORDPRESS_TITLE}

      - WORDPRESS_ADMIN_USER=${WP_ADMIN}
      - WORDPRESS_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
    
      - WORDPRESS_DB_PASSWORD_FILE=/run/secrets/db_password
      - WORDPRESS_ADMIN_PASSWORD_FILE=/run/secrets/wp_admin_pass
      - REDIS_SECRET_FILE=/run/secrets/redis_password

      - REDIS_PORT=${REDIS_PORT}
      - REDIS_HOST=${REDIS_HOST}

    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

    secrets:
      - db_password
      - wp_admin_pass
      - redis_password

    healthcheck:
      test: ["CMD-SHELL", "nc -zv wordpress 9000 || exit 1"]
      interval: 20s
      timeout: 60s
      retries: 5
      start_period: 10s

  # ===========================================
  #               Redis Service
  # ===========================================

  redis:
    build: ./requirements/bonus/redis
    image: redis
    container_name: redis
    restart: always

    environment:
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password

    secrets:
      - redis_password
    networks:
      - inception
    volumes:
      - redis_data:/var/lib/redis

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 60s
      retries: 5
      start_period: 10s

  # ===========================================
  #               Adminer Service
  # ===========================================

  adminer:
    build: ./requirements/bonus/adminer
    image: adminer
    container_name: adminer
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception

    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080 || exit 1"]
      interval: 20s
      timeout: 60s
      retries: 5
      start_period: 10s

  # ===========================================
  #               FTP Service
  # ===========================================

  ftp:
    build: ./requirements/bonus/ftp
    image: ftp
    container_name: ftp
    restart: always

    depends_on:
      wordpress:
        condition: service_healthy

    ports:
      - "${FTP_PORT}:21"
      - "${FTP_PASV_PORT_RANGE}:30000-30009"

    environment:
      FTP_USER: ${FTP_USER}
      FTP_PASSWORD_FILE: "/run/secrets/ftp_password"

    secrets:
      - ftp_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

    extra_hosts:
      - "usogukpi.42.fr:127.0.0.1"

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 21"]
      interval: 20s
      timeout: 60s
      retries: 5
      start_period: 10s

  # ===========================================
  #               Hugo Service
  # ===========================================

  hugo:
    build: ./requirements/bonus/hugo
    image: hugo
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    container_name: hugo
    restart: always
    networks:
      - inception

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:1313/hugo/ || exit 1"]
      interval: 20s
      timeout: 60s
      retries: 5
      start_period: 10s


  # ===========================================
  #               Portainer Service
  # ===========================================

  portainer:
    build: ./requirements/bonus/portainer
    image: portainer
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - inception

    healthcheck:
      test: ["CMD-SHELL", "curl -k -f http://localhost:9000 || exit 1"]
      interval: 20s
      timeout: 60s
      retries: 5
      start_period: 10s

# ===========================================
#                  Volumes             
# ===========================================

volumes:

  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/wordpress

  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/redis

  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/portainer


# ===========================================
#                  Networks             
# ===========================================

networks:
  inception:
    name: inception
    driver: bridge

# ===========================================
#                  Secrets             
# ===========================================

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_pass:
    file: ../secrets/wp_admin_password.txt
  ftp_password:
    file: ../secrets/ftp_password_bonus.txt
  redis_password:
    file: ../secrets/redis_password_bonus.txt
