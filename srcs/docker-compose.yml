# ===========================================
#             Docker Compose File
# ===========================================

services:

  # ===========================================
  #               Nginx Service               
  # ===========================================

  nginx:
    build: ./requirements/nginx
    image: inception/nginx:inception
    container_name: nginx
    restart: always
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    ports:
      - "${NGINX_PORT}:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

    depends_on:
      wordpress:
        condition: service_healthy
      hugo:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "curl -k -I https://localhost | grep -i nginx || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ===========================================
  #               MariaDB Service             
  # ===========================================

  mariadb:
    build: ./requirements/mariadb
    image: inception/mariadb:inception
    container_name: mariadb
    restart: always

    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=wp_user
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password

    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    secrets:
      - db_root_password
      - db_password

    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ===========================================
  #               WordPress Service
  # ===========================================

  wordpress:
    build: ./requirements/wordpress
    image: inception/wordpress:inception
    container_name: wordpress
    restart: always

    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - WORDPRESS_DB_HOST=${WORDPRESS_DB_HOST}
      - WORDPRESS_DB_NAME=${DB_NAME}
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER}
      - WORDPRESS_TITLE=${WORDPRESS_TITLE}

      - WORDPRESS_ADMIN_USER=${WP_ADMIN}
      - WORDPRESS_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
    
      - WORDPRESS_DB_PASSWORD_FILE=/run/secrets/db_password
      - WP_CREDENTIALS_FILE=/run/secrets/wp_admin_user

      - REDIS_PORT=${REDIS_PORT}
      - REDIS_HOST=${REDIS_HOST}

    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

    secrets:
      - db_password
      - wp_admin_user
      - redis_password

    healthcheck:
      test: ["CMD", "sh", "-c", "[ -f /var/www/html/wp-config.php ]"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ===========================================
  #               Redis Service
  # ===========================================

  redis:
    build: ./requirements/bonus/redis
    image: inception/redis:inception
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    secrets:
      - redis_password
    networks:
      - inception
    volumes:
      - redis_data:/var/lib/redis

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ===========================================
  #               Adminer Service
  # ===========================================

  adminer:
    build: ./requirements/bonus/adminer
    image: inception/adminer:inception
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mariadb
    networks:
      - inception

    healthcheck:
          test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080 || exit 1"]
          interval: 30s
          timeout: 5s
          retries: 3
          start_period: 10s

  # ===========================================
  #               FTP Service
  # ===========================================

  ftp:
    build: ./requirements/bonus/ftp
    image: inception/ftp:inception
    container_name: ftp
    restart: always

    depends_on:
      wordpress:
        condition: service_healthy

    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    environment:
      FTP_USER: ${FTP_USER}
    secrets:
      - ftp_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 21"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================
  #               Hugo Service
  # ===========================================

  hugo:
    build: ./requirements/bonus/hugo
    image: inception/hugo:inception
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    container_name: hugo
    restart: always
    networks:
      - inception

  # ===========================================
  #               Portainer Service
  # ===========================================

  portainer:
    build: ./requirements/bonus/portainer
    image: inception/portainer:inception
    container_name: portainer
    restart: always
    ports:
      - "${PORTAINER_PORT}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - inception

    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:9443 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

# ===========================================
#                  Volumes             
# ===========================================

volumes:

  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/wordpress

  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/redis
  
  hugo:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/hugo

  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/portainer


# ===========================================
#                  Networks             
# ===========================================

networks:
  inception:
    name: inception
    driver: bridge

# ===========================================
#                  Secrets             
# ===========================================

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_user:
    file: ../secrets/credentials.txt
  ftp_password:
    file: ../secrets/ftp_password_bonus.txt
  redis_password:
    file: ../secrets/redis_password_bonus.txt
